name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare assets
      run: |
        mkdir -p android/app/src/main/assets/www
        cp index.html manifest.json sw.js modules.json android/app/src/main/assets/www/
        mkdir -p android/app/src/main/assets/www/icons
        cp icons/* android/app/src/main/assets/www/icons/ || true

    - name: Grant execute permission for gradlew
      run: |
        cd android
        gradle wrapper || true
        chmod +x gradlew || true

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Turkce-Tutanak-Asistani-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
